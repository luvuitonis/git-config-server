server:
  port: 8080
# Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
  api-docs:
    path: /v3/api-docs
logging:
  level:
    com.zaxxer.hikari: DEBUG
spring:
  datasource:
    #url: jdbc:h2:mem:ecommercedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    #driverClassName: org.h2.Driver
    driverClassName: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://db-ecom-pr.cot284mke3iz.us-east-1.rds.amazonaws.com/ecommerce
    username: ecpr
    password: "#9669Dbec"
    hikari:
      maximum-pool-size: 50
      idle-timeout: 30000
      connection-timeout: 49000
      max-lifetime: 1800000
      pool-name: logEcomPool
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
